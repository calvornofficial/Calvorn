<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALVORNFEARLESS - Calvorn's World</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050306;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* --- LOADER SCREEN --- */
        .loader-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .avatar-box {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin-bottom: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-box::before {
            content: '';
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230,0,0,0.6) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
        }

        .avatar-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 4px solid #8b0000;
            object-fit: cover;
            z-index: 2;
            position: relative;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .subtitle {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: #ff3333;
            letter-spacing: 1px;
            margin-bottom: 40px;
            text-align: center;
        }

        .progress-container {
            width: 85%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 10px rgba(230, 0, 0, 0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff1a1a, #ff6666);
            border-radius: 10px;
            box-shadow: 0 0 8px #ff1a1a;
        }

        .progress-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #ff3333;
            margin-top: 15px;
        }

        /* --- PORTAL MAIN SCREEN --- */
        .main-content {
            display: none;
            width: 100%;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .portal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 15px;
            color: #d1d1d1;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .portal-frame {
            width: 220px;
            height: 280px;
            margin: 0 auto 30px auto;
            border: 12px solid #2d2438;
            background-color: #0f051d;
            box-shadow: inset 0 0 20px #9d00ff, 0 0 15px rgba(157, 0, 255, 0.4);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .portal-swirl {
            width: 180%;
            height: 180%;
            background: radial-gradient(circle, #d946ef 0%, #7e22ce 40%, transparent 70%);
            animation: spin 6s linear infinite;
            filter: blur(8px);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .world-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .enter-btn {
            width: 100%;
            padding: 16px;
            background: rgba(45, 20, 60, 0.6);
            border: 2px solid #a855f7;
            color: #e9d5ff;
            font-family: monospace;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        .enter-btn:hover {
            background: #a855f7;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
        }

        .footer-text {
            font-size: 12px;
            color: #888888;
            margin-top: 15px;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Loader Screen (Exactly 2 Seconds) -->
        <div class="loader-screen" id="loader">
            <div class="avatar-box">
                <!-- High-quality PvP Anime Avatar -->
                <img src="https://i.pinimg.com/564x/02/76/8a/02768a41768832a8ee68f2378fef1db4.jpg" alt="PvP Avatar" class="avatar-img">
            </div>
            <h1 class="title">CALVORNFEARLESS</h1>
            <p class="subtitle">DEVELOPER • PVPER • CODER</p>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- Portal Screen -->
        <div class="main-content" id="mainContent">
            <h2 class="portal-title">CALVORNFEARLESS</h2>
            
            <div class="portal-frame">
                <div class="portal-swirl"></div>
            </div>

            <h3 class="world-text">Calvorn's world</h3>
            
            <button class="enter-btn">▶ Click to enter Calvorn's world</button>
            <p class="footer-text">Your next adventure starts here</p>
        </div>
    </div>

    <script>
        // Exact 2 Seconds Timer Logic
        let progress = 0;
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const loader = document.getElementById('loader');
        const mainContent = document.getElementById('mainContent');

        const totalDuration = 2000; // Exact 2000ms (2 seconds)
        const intervalTime = 20;    // Step every 20ms
        const increment = 100 / (totalDuration / intervalTime);

        const timer = setInterval(() => {
            progress += increment;

            if (progress >= 100) {
                progress = 100;
                clearInterval(timer);

                // Smooth Auto Switch
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        mainContent.style.display = 'block';
                        setTimeout(() => {
                            mainContent.style.opacity = '1';
                        }, 50);
                    }, 500);
                }, 150);
            }

            progressBar.style.width = progress + '%';
            progressText.innerText = Math.floor(progress) + '%';
        }, intervalTime);
    </script>
</body>
  </html>
