<a href="#world" class="explore-btn" id="exploreBtn">
  <span>EXPLORE MY WORLD</span>
  <span class="arrow">↗</span>
</a>

<div id="worldTransition">
  <div class="transition-ring"></div>
  <h1>ENTERING CALVORN</h1>
  <p>PREPARE TO EXPLORE</p>
</div>

<style>
.explore-btn {
  display: inline-flex;
  align-items: center;
  gap: 18px;
  padding: 18px 28px;
  color: white;
  text-decoration: none;
  font: 900 13px Arial, sans-serif;
  letter-spacing: 2px;
  background: linear-gradient(110deg, #85000b, #ff172b, #85000b);
  background-size: 200% 100%;
  border: 1px solid #ff3948;
  box-shadow: 0 0 25px #ff102b66;
  transition: .3s;
  animation: redFlow 3s linear infinite;
}

.explore-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 0 45px #ff102b;
}

@keyframes redFlow {
  to { background-position: 200% 0; }
}

#worldTransition {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 15px;
  background: #080808;
  color: white;
  opacity: 0;
  visibility: hidden;
  clip-path: circle(0% at 50% 50%);
  transition: clip-path .8s ease, opacity .5s;
}

#worldTransition.active {
  opacity: 1;
  visibility: visible;
  clip-path: circle(150% at 50% 50%);
}

#worldTransition h1 {
  color: #ff2438;
  text-align: center;
  font-size: clamp(25px, 6vw, 55px);
  letter-spacing: 5px;
  animation: enterTitle 1s both;
  text-shadow: 0 0 25px #ff102b;
}

#worldTransition p {
  color: #aaa;
  font-size: 11px;
  letter-spacing: 5px;
}

.transition-ring {
  width: 65px;
  height: 65px;
  border: 3px solid #4a1017;
  border-top-color: #ff2438;
  border-right-color: #ff2438;
  border-radius: 50%;
  animation: spinRing .7s linear infinite;
  box-shadow: 0 0 25px #ff102b55;
}

@keyframes spinRing {
  to { transform: rotate(360deg); }
}

@keyframes enterTitle {
  from { opacity: 0; transform: scale(.7); filter: blur(12px); }
  to { opacity: 1; transform: scale(1); filter: blur(0); }
}
</style>

<script>
document.getElementById("exploreBtn").addEventListener("click", function(e) {
  e.preventDefault();

  const transition = document.getElementById("worldTransition");
  transition.classList.add("active");

  setTimeout(() => {
    window.location.href = "#world";
    transition.classList.remove("active");
  }, 1800);
});
</script>
